name: 웹 버전 배포 (GitHub Pages)

# main 이 바뀌면 웹 앱(https://shun1403.github.io/pocket-hwp/)을 새로 배포한다. Actions 탭에서 직접 실행해도 된다.
# 저장소 Settings → Pages → Source가 "GitHub Actions"여야 한다.
# (무료 요금제에서는 저장소가 Public이어야 Pages를 쓸 수 있다.)
on:
  push:
    branches: [main]
    # 문서만 바뀌면 다시 배포하지 않는다.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          # 보안 패치가 나온 최신 22.x를 쓴다 (러너에 캐시된 옛 버전을 쓰지 않도록)
          node-version-file: .node-version
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
