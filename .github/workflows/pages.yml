name: 웹 버전 배포 (GitHub Pages)

# 웹 배포는 보류 중이라 자동으로 돌지 않는다.
# 쓰려면 저장소 Settings → Pages → Source를 "GitHub Actions"로 켠 뒤 Actions 탭에서 직접 실행한다.
# (무료 요금제에서는 저장소가 Public이어야 Pages를 쓸 수 있다.)
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
