name: 안드로이드 APK 릴리스

# 서명된 APK를 만들어 GitHub Releases에 올린다. 릴리스를 만드는 방법은 두 가지다.
#  1. v로 시작하는 태그(예: v0.2.0)를 올리거나 GitHub 웹에서 그 태그로 릴리스를 만든다.
#  2. Actions 탭에서 이 워크플로를 main 으로 직접 실행하며 버전(예: 0.2.0)을 넣는다.
#     태그·릴리스까지 이 워크플로가 만든다. 같은 버전이 이미 있으면 멈춘다.
# 버전 없이 직접 실행하거나 안드로이드 빌드를 바꾸는 PR이면 릴리스 없이 APK만 결과물(artifact)로 남긴다.
#
# 서명 키(저장소 Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  keystore 파일을 base64로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 키가 없으면 임시 키로 서명한다. 그 APK는 설치는 되지만 다음 버전으로 업데이트할 수 없다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '릴리스 버전 (예: 0.2.0). 비우면 릴리스 없이 APK만 만든다'
        required: false
        default: ''
      prerelease:
        description: '사전 릴리스(베타)로 올리기'
        type: boolean
        default: true
  # 서명·빌드 설정을 바꾸는 PR은 합치기 전에 APK를 실제로 만들어 본다.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - android/**
      - capacitor.config.ts

# 빌드는 읽기 권한만 갖는다. Releases에 올리는 publish 작업만 쓰기 권한을 받는다.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 외부 액션은 태그가 바뀌어도 같은 코드를 쓰도록 커밋으로 고정한다.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec cap sync android

      - name: 버전 정하기
        id: ver
        env:
          # 입력값은 셸에 바로 넣지 않고 환경 변수로 받아 형식을 확인한다.
          INPUT_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          elif [[ -n "$INPUT_VERSION" ]]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::버전은 0.2.0 처럼 숫자 세 개로 넣어 주세요."
              exit 1
            fi
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              echo "::error::릴리스는 main 에서만 만들 수 있어요."
              exit 1
            fi
            echo "name=$INPUT_VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 빌드 (release)
        working-directory: android
        env:
          POCKET_VERSION_NAME: ${{ steps.ver.outputs.name }}
          POCKET_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 정렬·서명
        env:
          # PR은 합치기 전 코드로 빌드하므로 진짜 서명 키를 건네지 않는다 (임시 키로 서명).
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="PocketHWP-${VERSION}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" aligned.apk
            rm -f release.jks
          else
            echo "::warning::서명 키가 없어 임시 키로 서명합니다. 이 APK는 다음 버전으로 업데이트할 수 없습니다."
            keytool -genkeypair -keystore temp.jks -storepass temppass -keypass temppass -alias temp \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Pocket HWP temporary key"
            "$BT/apksigner" sign --ks temp.jks --ks-pass pass:temppass --out "$OUT" aligned.apk
            rm -f temp.jks
          fi
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-hwp-apk
          path: ${{ env.APK }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-hwp-apk
      # 태그로 시작한 경우: 웹에서 만든 릴리스가 이미 있을 수 있어 설명은 건드리지 않고 APK만 붙인다.
      - name: GitHub Releases에 올리기 (태그)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: PocketHWP-*.apk
      - name: 같은 버전이 이미 있는지 확인
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.apk.outputs.version }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" > /dev/null 2>&1; then
            echo "::error::$TAG 이(가) 이미 있어요. 다른 버전 번호로 다시 실행해 주세요."
            exit 1
          fi
      # 직접 실행한 경우: 이 커밋에 태그를 만들고 변경 목록을 붙여 릴리스를 새로 만든다.
      - name: GitHub Releases에 올리기 (직접 실행)
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ needs.apk.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Pocket HWP ${{ needs.apk.outputs.version }}${{ inputs.prerelease && ' (베타)' || '' }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: PocketHWP-*.apk
