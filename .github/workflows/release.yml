name: 안드로이드 APK 릴리스

# v로 시작하는 태그(예: v0.2.0)를 올리면 서명된 APK를 만들어 GitHub Releases에 올린다.
# Actions 탭에서 직접 실행하거나 안드로이드 빌드를 바꾸는 PR이면 릴리스 없이 APK만 결과물(artifact)로 남긴다.
#
# 서명 키(저장소 Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64  keystore 파일을 base64로 바꾼 값
#   ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# 키가 없으면 임시 키로 서명한다. 그 APK는 설치는 되지만 다음 버전으로 업데이트할 수 없다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  # 서명·빌드 설정을 바꾸는 PR은 합치기 전에 APK를 실제로 만들어 본다.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - android/**
      - capacitor.config.ts

# 빌드는 읽기 권한만 갖는다. Releases에 올리는 publish 작업만 쓰기 권한을 받는다.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 외부 액션은 태그가 바뀌어도 같은 코드를 쓰도록 커밋으로 고정한다.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          check-latest: true
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm exec cap sync android

      - name: 버전 정하기
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: APK 빌드 (release)
        working-directory: android
        env:
          POCKET_VERSION_NAME: ${{ steps.ver.outputs.name }}
          POCKET_VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew assembleRelease --no-daemon

      - name: 정렬·서명
        env:
          # PR은 합치기 전 코드로 빌드하므로 진짜 서명 키를 건네지 않는다 (임시 키로 서명).
          KEYSTORE_BASE64: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_BASE64 || '' }}
          KEYSTORE_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEYSTORE_PASSWORD || '' }}
          KEY_ALIAS: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_ALIAS || '' }}
          KEY_PASSWORD: ${{ github.event_name != 'pull_request' && secrets.ANDROID_KEY_PASSWORD || '' }}
          VERSION: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          OUT="PocketHWP-${VERSION}.apk"
          "$BT/zipalign" -p -f 4 "$UNSIGNED" aligned.apk
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > release.jks
            "$BT/apksigner" sign --ks release.jks --ks-pass env:KEYSTORE_PASSWORD \
              --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "$OUT" aligned.apk
            rm -f release.jks
          else
            echo "::warning::서명 키가 없어 임시 키로 서명합니다. 이 APK는 다음 버전으로 업데이트할 수 없습니다."
            keytool -genkeypair -keystore temp.jks -storepass temppass -keypass temppass -alias temp \
              -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Pocket HWP temporary key"
            "$BT/apksigner" sign --ks temp.jks --ks-pass pass:temppass --out "$OUT" aligned.apk
            rm -f temp.jks
          fi
          "$BT/apksigner" verify --print-certs "$OUT"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: pocket-hwp-apk
          path: ${{ env.APK }}

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pocket-hwp-apk
      - name: GitHub Releases에 올리기
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: PocketHWP-*.apk
          generate_release_notes: true
